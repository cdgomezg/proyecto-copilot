<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" style="background:#f5f7fa">
  <defs>
    <linearGradient id="domain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffb84d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="port-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="adapter-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8899;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="500" fill="#f5f7fa"/>
  
  <!-- Title -->
  <text x="300" y="40" font-size="28" font-weight="bold" fill="#1a2b3d" text-anchor="middle" font-family="Arial, sans-serif">Hexagonal Architecture</text>
  
  <!-- Hexagon Core Domain -->
  <polygon points="300,80 380,130 380,230 300,280 220,230 220,130" fill="url(#domain-grad)" stroke="#1a2b3d" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="180" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Business</text>
  <text x="300" y="200" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Domain</text>
  
  <!-- Left Ports & Adapters -->
  <!-- Web Adapter -->
  <rect x="10" y="100" width="100" height="70" rx="6" fill="url(#adapter-grad)" filter="url(#shadow)"/>
  <text x="60" y="115" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Web</text>
  <text x="60" y="135" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Adapter</text>
  <line x1="110" y1="135" x2="220" y2="155" stroke="#1a2b3d" stroke-width="2"/>
  
  <!-- REST API Port -->
  <rect x="30" y="190" width="80" height="60" rx="6" fill="url(#port-grad)" filter="url(#shadow)"/>
  <text x="70" y="210" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">REST API</text>
  <text x="70" y="228" font-size="10" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Port</text>
  <line x1="110" y1="220" x2="220" y2="210" stroke="#1a2b3d" stroke-width="2"/>
  
  <!-- Right Ports & Adapters -->
  <!-- Database Adapter -->
  <rect x="490" y="100" width="100" height="70" rx="6" fill="url(#adapter-grad)" filter="url(#shadow)"/>
  <text x="540" y="115" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Database</text>
  <text x="540" y="135" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Adapter</text>
  <line x1="490" y1="135" x2="380" y2="155" stroke="#1a2b3d" stroke-width="2"/>
  
  <!-- Data Port -->
  <rect x="490" y="190" width="100" height="60" rx="6" fill="url(#port-grad)" filter="url(#shadow)"/>
  <text x="540" y="210" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Data Port</text>
  <text x="540" y="228" font-size="10" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">(Repository)</text>
  <line x1="490" y1="220" x2="380" y2="210" stroke="#1a2b3d" stroke-width="2"/>
  
  <!-- Bottom Adapters -->
  <!-- Cache Adapter -->
  <rect x="80" y="330" width="100" height="70" rx="6" fill="url(#adapter-grad)" filter="url(#shadow)"/>
  <text x="130" y="345" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Cache</text>
  <text x="130" y="365" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Adapter</text>
  <line x1="130" y1="330" x2="280" y2="280" stroke="#1a2b3d" stroke-width="2"/>
  
  <!-- Message Queue Adapter -->
  <rect x="420" y="330" width="100" height="70" rx="6" fill="url(#adapter-grad)" filter="url(#shadow)"/>
  <text x="470" y="345" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Message</text>
  <text x="470" y="365" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Adapter</text>
  <line x1="470" y1="330" x2="320" y2="280" stroke="#1a2b3d" stroke-width="2"/>
  
  <!-- Legend -->
  <text x="50" y="440" font-size="12" font-weight="bold" fill="#1a2b3d" font-family="Arial, sans-serif">◆ Domain</text>
  <rect x="30" y="435" width="15" height="15" fill="url(#domain-grad)"/>
  
  <text x="200" y="440" font-size="12" font-weight="bold" fill="#1a2b3d" font-family="Arial, sans-serif">◆ Ports</text>
  <rect x="170" y="435" width="15" height="15" fill="url(#port-grad)"/>
  
  <text x="350" y="440" font-size="12" font-weight="bold" fill="#1a2b3d" font-family="Arial, sans-serif">◆ Adapters</text>
  <rect x="320" y="435" width="15" height="15" fill="url(#adapter-grad)"/>
</svg>