<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" style="background:#f5f7fa">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffa500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffb84d;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="500" fill="#f5f7fa"/>
  
  <!-- Title -->
  <text x="300" y="40" font-size="28" font-weight="bold" fill="#1a2b3d" text-anchor="middle" font-family="Arial, sans-serif">Arquitectura en Capas</text>
  
  <!-- Presentation Layer -->
  <rect x="50" y="90" width="500" height="80" rx="8" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="300" y="125" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Presentation Layer</text>
  <text x="300" y="150" font-size="13" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">UI · Controllers · Routing</text>
  
  <!-- Arrow Down -->
  <line x1="300" y1="170" x2="300" y2="200" stroke="#1a2b3d" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#1a2b3d" />
    </marker>
  </defs>
  
  <!-- Business Logic Layer -->
  <rect x="50" y="200" width="500" height="80" rx="8" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="300" y="235" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Business Logic Layer</text>
  <text x="300" y="260" font-size="13" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Services · Validators · Transformers</text>
  
  <!-- Arrow Down -->
  <line x1="300" y1="280" x2="300" y2="310" stroke="#1a2b3d" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Data Access Layer -->
  <rect x="50" y="310" width="500" height="80" rx="8" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="300" y="345" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Data Access Layer</text>
  <text x="300" y="370" font-size="13" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Repositories · Queries · ORM</text>
  
  <!-- Arrow Down -->
  <line x1="300" y1="390" x2="300" y2="420" stroke="#1a2b3d" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Database -->
  <rect x="50" y="420" width="500" height="50" rx="8" fill="#1a2b3d" filter="url(#shadow)"/>
  <text x="300" y="451" font-size="18" font-weight="bold" fill="#00d4d4" text-anchor="middle" font-family="Arial, sans-serif">Database</text>
</svg>